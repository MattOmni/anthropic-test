name: Run Analysis Job

# Triggered only when jobs/latest.json is pushed on this branch.
on:
  push:
    branches:
      - "claude/compare-vad-models-Q7R1A"
    paths:
      - "jobs/latest.json"

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push results back to the repo

    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/compare-vad-models-Q7R1A
          fetch-depth: 1

      # ── Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Pip cache (torch etc. are large — cache saves ~5 min) ─────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── System deps ───────────────────────────────────────────────────
      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends ffmpeg libc++1

      # ── Python deps ───────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # ten-vad must be installed from GitHub (not PyPI)
          pip install -U git+https://github.com/TEN-framework/ten-vad.git
          # intervaltree is required by Respiro-en
          pip install intervaltree

      # ── Respiro-en model (for breath task) ───────────────────────────
      - name: Clone Respiro-en model
        run: |
          git clone --depth=1 https://github.com/ydqmkkx/Respiro-en models/respiro-en

      # ── Run the job ───────────────────────────────────────────────────
      - name: Run analysis
        id: run_job
        run: python scripts/run_job.py

      # ── Commit results back to the working branch ────────────────────
      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "results: ${JOB_ID:-$(date +%Y%m%d-%H%M%S)}"
          git push origin claude/compare-vad-models-Q7R1A
